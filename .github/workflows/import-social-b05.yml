name: Import Seedream 5.5 social images and video previews (one-time)
on:
  push:
    branches:
      - research/seedream55-social-b05-20261110
permissions:
  contents: write
jobs:
  import-media:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image processor
        run: python -m pip install 'Pillow>=11,<12'
      - name: Check ffmpeg availability
        run: ffmpeg -version | head -n 1
      - name: Collect images, sample videos, create short animated previews
        run: python3 scripts/import_social_b05.py
      - name: Check generated bilingual cases and media integrity
        run: python3 scripts/build.py --check && python3 scripts/validate.py
      - name: Commit actual source-linked preview files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/cases.json docs/media-check.json docs/SOURCES.md docs/social-source-batch05-audit.json scripts/build.py scripts/validate.py README.md README.zh-CN.md cases/ assets/previews/ assets/animations/
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish new X social image cases and animated excerpts [skip ci]"
            git push origin HEAD:$GITHUB_REF_NAME
          fi
