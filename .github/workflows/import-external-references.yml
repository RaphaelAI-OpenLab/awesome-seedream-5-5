name: Fetch external Seedream references (one-time)
on:
  push:
    branches: [research/external-web-references-20261111]
permissions:
  contents: write
jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install JPEG and WebP decoder
        run: python -m pip install 'Pillow>=11,<12'
      - name: Fetch review previews and produce bilingual reference pages
        run: python3 scripts/import_external_refs_once.py
      - name: Check generated references and all root pages
        run: |
          python3 scripts/build_external_refs.py --check
          python3 scripts/validate_external_refs.py
          python3 scripts/build.py --check
          python3 scripts/validate.py
      - name: Commit real downloaded reference previews and indexes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add external-references/ README.md README.zh-CN.md
          git diff --cached --quiet || git commit -m "feat: stage web-wide Seedream prompt references and reduced review thumbnails [skip ci]"
          git push origin HEAD:$GITHUB_REF_NAME
