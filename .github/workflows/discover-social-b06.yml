name: Review new Seedream social images (temporary)
on:
  push:
    branches: [research/seedream55-social-b06-20261110]
permissions:
  contents: read
jobs:
  review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=11,<12'
      - name: Download source-matched photos for visual review
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, re, urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          entries=[('KakiponzuX','2119772951889224178'),('KakiponzuX','2119799171397906607'),('KakiponzuX','2119801752656531616'),('lyraxana','2118884892427551046'),('lyraxana','2118896484934668512'),('lyraxana','2119716289581334969'),('Dheepanratnam','2119803435461599638')]
          out=Path('/tmp/seedream-review');out.mkdir()
          known={re.search(r'/status/(\d+)',c['source_url']).group(1) for c in json.loads(Path('content/cases.json').read_text()) if re.search(r'/status/(\d+)',c['source_url'])}
          records=[];cells=[]
          def get(url,cap=16000000):
           request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
           with urllib.request.urlopen(request,timeout=30) as response:
            content=response.read(cap+1)
            if len(content)>cap:raise ValueError('response size limit')
            return content
          for group,(handle,tid) in enumerate(entries,1):
           if tid in known:raise ValueError('Already catalogued '+tid)
           tweet=json.loads(get('https://api.fxtwitter.com/'+handle+'/status/'+tid,2000000))['tweet']
           if tweet['author']['screen_name'].lower()!=handle.lower():raise ValueError('author mismatch')
           text=tweet.get('text','')
           if not re.search(r'seedream[\s_.-]*5[\s_.-]*5',text,re.I):raise ValueError('no model evidence')
           photos=(tweet.get('media') or {}).get('photos') or []
           if not photos:raise ValueError('no photos '+tid)
           record={'group':group,'handle':handle,'id':tid,'url':'https://x.com/'+handle+'/status/'+tid,'photos':[],'published_at':tweet.get('created_at')}
           for index,photo in enumerate(photos,1):
            url=photo['url']
            if not url.startswith('https://pbs.twimg.com/media/'):raise ValueError('unsupported image host')
            raw=get(url)
            with Image.open(io.BytesIO(raw)) as source:
             Image.MAX_IMAGE_PIXELS=48000000
             image=ImageOps.exif_transpose(source).convert('RGB');image.thumbnail((640,640))
             filename=f'{group:02d}-{index:02d}.jpg';image.save(out/filename,'JPEG',quality=82,optimize=True)
             thumb=image.copy();thumb.thumbnail((280,240))
             cell=Image.new('RGB',(300,280),'white');cell.paste(thumb,((300-thumb.width)//2,25+(240-thumb.height)//2))
             ImageDraw.Draw(cell).text((8,8),f'{group}.{index} @{handle}',fill='black');cells.append(cell)
            record['photos'].append({'file':filename,'id':str(photo.get('id')),'url':url,'alt':photo.get('altText'),'source_sha256':hashlib.sha256(raw).hexdigest()})
           records.append(record)
          sheet=Image.new('RGB',(900,280*((len(cells)+2)//3)),(220,220,220))
          for i,cell in enumerate(cells):sheet.paste(cell,((i%3)*300,(i//3)*280))
          sheet.save(out/'contact.jpg','JPEG',quality=80,optimize=True)
          (out/'review.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          print('REVIEW',json.dumps({'posts':len(records),'photos':len(cells),'contact_bytes':(out/'contact.jpg').stat().st_size,'records':records},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: seedream-b06-visual-review
          path: /tmp/seedream-review/
          retention-days: 1
