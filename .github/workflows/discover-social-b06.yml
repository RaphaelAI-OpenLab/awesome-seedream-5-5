name: Discover new Seedream social posts (temporary)
on:
  push:
    branches: [research/seedream55-social-b06-20261110]
permissions:
  contents: read
jobs:
  discover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Find original posts and inspect public media
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, html, json, re, urllib.request
          from pathlib import Path
          sources=[
           'https://agi-labo.com/radar?m=image',
           'https://picyep.com/seedream-5-5',
           'https://xaibang.com/pulse',
           'https://www.itvoice.in/one-product-shoot-two-weeks-of-posts-planning-a-social-calendar-around-seedream-5-5s-multi-round-editing',
           'https://teapaw.org/KakiponzuX',
           'https://teapaw.org/ahmetmertugrul',
           'https://teapaw.org/lyraxana',
           'https://teapaw.org/Dheepanratnam',
           'https://maomaoailab.com/zh/news/'
          ]
          known={re.search(r'/status/(\d+)',c['source_url']).group(1) for c in json.loads(Path('content/cases.json').read_text()) if re.search(r'/status/(\d+)',c['source_url'])}
          def get(url):
           req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/json'})
           with urllib.request.urlopen(req,timeout=22) as r:
            b=r.read(5000001)
            if len(b)>5000000: raise ValueError('response too big')
            return b.decode('utf-8',errors='replace')
          def page(url):
           try:
            text=html.unescape(get(url)).replace('\\/','/')
            found={}
            pattern=r'(?:https?://(?:www\.)?(?:x\.com|twitter\.com|teapaw\.org|teapawt\.org|xitter\.cf))?/([A-Za-z0-9_]{1,20})/status/(\d{16,21})'
            for m in re.finditer(pattern,text):
             handle,tid=m.groups()
             if tid in known or handle.lower() in ('i','home'): continue
             vicinity=re.sub('<[^>]+>',' ',text[max(0,m.start()-2000):m.end()+2000])
             related=bool(re.search(r'seedream[\s_.-]*5[\s_.-]*5',vicinity,re.I))
             found[tid]=(handle,tid,url,related)
            print('DISCOVERY',json.dumps({'page':url,'new_posts':len(found),'related':sum(x[3] for x in found.values())}),flush=True)
            return list(found.values())
           except Exception as exc:
            print('PAGE_ERROR',url,str(exc)[:180],flush=True);return []
          candidates={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
           for records in pool.map(page,sources):
            for r in records:
             if r[1] not in candidates or r[3]: candidates[r[1]]=r
          targets=sorted(candidates.values(),key=lambda x:not x[3])[:75]
          print('TARGETS',json.dumps(targets,ensure_ascii=False),flush=True)
          def post(record):
           handle,tid,page,related=record
           try:
            response=json.loads(get('https://api.fxtwitter.com/'+handle+'/status/'+tid))
            tw=response.get('tweet') or {}
            author=(tw.get('author') or {}).get('screen_name','')
            if author.lower()!=handle.lower(): return None
            text=tw.get('text') or ''
            if not re.search(r'seedream[\s_.-]*5[\s_.-]*5',text,re.I):return None
            media=(tw.get('media') or {}).get('all') or []
            images=[{'id':m.get('id'),'url':m.get('url'),'alt':m.get('altText')} for m in media if m.get('type')=='photo']
            videos=[{'id':m.get('id'),'url':m.get('url'),'thumbnail_url':m.get('thumbnail_url'),'type':m.get('type')} for m in media if m.get('type') in ('video','gif')]
            return {'id':tid,'author':author,'url':'https://x.com/'+author+'/status/'+tid,'text':text[:7000],'images':images,'videos':videos,'article_keys':list((tw.get('article') or {}).keys()) if isinstance(tw.get('article'),dict) else None,'source_discovery':page,'created_at':tw.get('created_at')}
           except Exception as exc:
            print('POST_ERROR',handle,tid,str(exc)[:150],flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
           for p in pool.map(post,targets):
            if p:print('MATCH',json.dumps(p,ensure_ascii=False),flush=True)
          PY
