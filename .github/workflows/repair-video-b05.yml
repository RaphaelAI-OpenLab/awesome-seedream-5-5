name: Repair original X video excerpts (temporary)
on:
  push:
    branches:
      - research/seedream55-social-b05-20261110
permissions:
  contents: write
jobs:
  video-recovery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install 'Pillow>=11,<12'
      - name: Extract six source videos as JPEG and animated GIF
        run: python3 scripts/repair_video_b05.py
      - name: Validate all source metadata and generated pages
        run: python3 scripts/build.py --check && python3 scripts/validate.py
      - name: Save recovered media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/cases.json docs/media-check.json docs/social-source-batch05-audit.json README.md README.zh-CN.md cases/ assets/previews/ assets/animations/
          if ! git diff --cached --quiet; then
            git commit -m "feat: recover original X video stills and animated excerpts [skip ci]"
            git push origin HEAD:$GITHUB_REF_NAME
          fi
