name: 校验案例库
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 检查生成一致性
        run: python scripts/build.py --check
      - name: 校验数据与链接
        run: python scripts/validate.py
