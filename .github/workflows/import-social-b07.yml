name: Import new Seedream 5.5 social cases (temporary)
on:
  push:
    branches: [research/seedream55-social-b07-20261111]
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image/video decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install 'Pillow>=11,<12'
      - name: Download original post media and create previews
        run: python3 scripts/import_social_b07.py
      - name: Validate generated case pages, media checks and README
        run: python3 scripts/build.py --check && python3 scripts/validate.py
      - name: Commit generated assets and metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/cases.json docs/media-check.json docs/SOURCES.md docs/social-source-batch07-audit.json README.md README.zh-CN.md cases/ assets/previews/ assets/animations/
          if ! git diff --cached --quiet; then
            git commit -m "feat: archive additional original Seedream 5.5 social media [skip ci]"
            git push origin HEAD:$GITHUB_REF_NAME
          fi
