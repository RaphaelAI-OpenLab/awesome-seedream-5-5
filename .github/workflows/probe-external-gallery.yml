name: Inspect external Seedream galleries (temporary)
on:
  push:
    branches: [research/external-web-references-20261111]
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4
      - run: python3 scripts/probe_external_sources.py
      - name: Save external website metadata for review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add external-references/.web-probe.json
          git diff --cached --quiet || git commit -m "chore: cache public source layouts for verification [skip ci]"
          git push origin HEAD:$GITHUB_REF_NAME
