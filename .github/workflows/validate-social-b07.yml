name: Validate social batch 07 (temporary)
on:
  push:
    branches: [research/seedream55-social-b07-20261111]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify deterministic bilingual output
        run: python3 scripts/build.py --check
      - name: Validate all assets, hashes, case metadata and internal links
        run: python3 scripts/validate.py
      - name: Ensure clean patch
        run: git diff --check
